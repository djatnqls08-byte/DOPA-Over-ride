<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DOPA System Override 페어틀 메이커</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>
  <!-- 사이버펑크 폰트 조합: Pretendard & 네온용 Share Tech Mono -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body { font-family: "Pretendard", -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-cyber { font-family: 'Share Tech Mono', monospace; }
    #previewCanvas { touch-action: none; cursor: crosshair; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #ff0055; border-radius: 4px; }
    
    /* 사이버펑크 배경 패턴 */
    .cyber-bg {
      background-color: #050505;
      background-image: linear-gradient(0deg, transparent 24%, rgba(255, 0, 85, 0.05) 25%, rgba(255, 0, 85, 0.05) 26%, transparent 27%, transparent 74%, rgba(255, 0, 85, 0.05) 75%, rgba(255, 0, 85, 0.05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(255, 0, 85, 0.05) 25%, rgba(255, 0, 85, 0.05) 26%, transparent 27%, transparent 74%, rgba(255, 0, 85, 0.05) 75%, rgba(255, 0, 85, 0.05) 76%, transparent 77%, transparent);
      background-size: 30px 30px;
    }
  </style>
</head>
<body class="cyber-bg text-zinc-100 min-h-screen pb-16">

  <!-- 헤더 -->
  <header class="border-b border-[#ff0055]/30 px-4 py-3 bg-[#050505]/90 backdrop-blur sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-xs font-bold tracking-widest text-[#ff0055] font-cyber">DOPA.SYS_OVERRIDE</span>
      <span class="text-[10px] text-zinc-900 bg-[#ff0055] px-1.5 py-0.5 rounded-sm font-cyber font-bold animate-pulse">WARNING</span>
    </div>
    <span class="text-xs text-zinc-500 font-cyber">v2.0 // 16:9</span>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- 1. 사이버펑크 캔버스 -->
    <div class="bg-black rounded-lg p-1.5 border-2 border-[#ff0055]/40 shadow-[0_0_25px_rgba(255,0,85,0.15)] flex flex-col items-center relative overflow-hidden">
      <div class="w-full flex items-center justify-between pb-1 px-2 text-[10px] text-[#ff0055] font-cyber">
        <span>> INIT_CANVAS_RENDER... <span class="animate-pulse">_</span></span>
        <button id="btnResetPositions" class="hover:text-white underline decoration-[#ff0055]">RESET_POS</button>
      </div>
      <canvas id="previewCanvas" width="960" height="540" class="w-full aspect-[16/9] bg-zinc-900 border border-zinc-800"></canvas>
    </div>

    <!-- 2. 내보내기 버튼 -->
    <div class="space-y-3 bg-[#0a0a0a] p-3.5 rounded-lg border border-zinc-800">
      <div class="grid grid-cols-2 gap-2">
        <button id="btnGenerateMP4" class="py-3 bg-[#ff0055] hover:bg-[#ff0055]/80 text-black font-cyber font-bold tracking-widest text-xs transition-all flex items-center justify-center space-x-1.5 shadow-[0_0_15px_rgba(255,0,85,0.4)]">
          <span>> EXPORT_MP4 [HQ]</span>
        </button>
        <button id="btnGenerateGIF" class="py-3 bg-zinc-800 hover:bg-zinc-700 text-[#ff0055] font-cyber font-bold tracking-widest border border-[#ff0055]/30 text-xs transition-all flex items-center justify-center space-x-1.5">
          <span>> EXPORT_GIF</span>
        </button>
      </div>

      <div id="loadingStatus" class="hidden space-y-1.5 py-1">
        <div class="w-full bg-zinc-900 h-1 rounded-none overflow-hidden border border-zinc-800">
          <div id="progressBar" class="bg-[#ff0055] h-full w-0 transition-all duration-100"></div>
        </div>
        <p id="statusMsg" class="text-center text-[10px] text-[#ff0055] font-cyber">> PROCESSING_DATA...</p>
      </div>

      <div id="resultArea" class="hidden flex flex-col items-center space-y-3 pt-2">
        <div id="previewMediaWrapper" class="w-full max-w-[320px] overflow-hidden border-2 border-[#ff0055] shadow-[0_0_20px_rgba(255,0,85,0.3)] aspect-[16/9] bg-black"></div>
        <div class="flex w-full gap-2">
          <a id="btnDownload" download="dopa_override_16x9" class="flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-black font-cyber font-bold text-center text-xs transition">
            > SAVE_TO_DEVICE
          </a>
          <button id="btnShareX" class="py-2.5 px-4 bg-white hover:bg-zinc-200 text-black font-bold text-xs transition flex items-center gap-1.5">
            𝕏 트윗
          </button>
        </div>
      </div>
    </div>

    <!-- 3. 사이버 컨트롤 패널 -->
    <div class="bg-[#0a0a0a] border border-zinc-800 overflow-hidden shadow-xl">
      <div class="grid grid-cols-3 border-b border-zinc-800 text-[11px] font-cyber font-bold text-center">
        <button id="tabBtn1" class="tab-btn py-3 border-b-2 border-[#ff0055] text-[#ff0055] transition" data-tab="tab1">> MEDIA</button>
        <button id="tabBtn2" class="tab-btn py-3 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 transition" data-tab="tab2">> CONSOLE_LOG</button>
        <button id="tabBtn3" class="tab-btn py-3 border-b-2 border-transparent text-zinc-500 hover:text-zinc-300 transition" data-tab="tab3">> SYS_COLOR</button>
      </div>

      <div class="p-4 space-y-4">
        
        <!-- [탭 1] 미디어 -->
        <div id="tab1" class="tab-content space-y-4">
          <div class="bg-[#050505] p-3.5 border border-zinc-800 space-y-3">
            <div class="flex justify-between items-center">
              <label class="text-xs font-bold text-zinc-300 font-cyber">TARGET_IMAGE (JPG/GIF)</label>
              <span id="bgStatus" class="text-[9px] text-[#ff0055] font-cyber border border-[#ff0055]/50 px-1 py-0.5">STANDBY</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex flex-col items-center justify-center p-3 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 cursor-pointer transition text-center group">
                <span class="text-sm mb-1">🖼️</span>
                <span class="text-[10px] font-bold text-zinc-300 font-cyber">OPEN_GALLERY</span>
                <input type="file" id="bgInputGallery" accept="image/*" class="hidden">
              </label>
              <label class="flex flex-col items-center justify-center p-3 bg-[#ff0055]/10 hover:bg-[#ff0055]/20 border border-[#ff0055]/40 cursor-pointer transition text-center group">
                <span class="text-sm mb-1">📁</span>
                <span class="text-[10px] font-bold text-[#ff0055] font-cyber">OPEN_FILES (GIF)</span>
                <input type="file" id="bgInputFiles" accept="*/*" class="hidden">
              </label>
            </div>
          </div>
        </div>

        <!-- [탭 2] 대사 및 시스템 콘솔 설정 -->
        <div id="tab2" class="tab-content hidden space-y-4">
          
          <!-- 상단 경고 캡슐 -->
          <div>
            <label class="text-[10px] text-zinc-400 font-cyber">> WARNING_MESSAGE</label>
            <input type="text" id="quoteText" placeholder="예: 접근 권한이 거부되었습니다." value="" class="w-full mt-1 bg-[#050505] border border-zinc-800 px-3 py-2 text-xs text-[#ff0055] placeholder-zinc-700 font-cyber focus:outline-none focus:border-[#ff0055]">
          </div>

          <!-- 터미널 스탯 바 -->
          <div class="bg-[#050505] p-3 border border-zinc-800 space-y-3">
            <span class="text-[10px] font-bold text-zinc-300 font-cyber">> TARGET_STATS</span>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[9px] text-zinc-500 font-cyber">SUBJECT_NAME</label>
                <input type="text" id="senderName" placeholder="예: 백우진" value="" class="w-full mt-0.5 bg-zinc-900 border border-zinc-800 px-2 py-1.5 text-xs text-white font-cyber">
              </div>
              <div>
                <label class="text-[9px] text-zinc-500 font-cyber">DANGER_LEVEL (0~100)</label>
                <input type="number" id="dangerLevel" value="85" min="0" max="100" class="w-full mt-0.5 bg-zinc-900 border border-zinc-800 px-2 py-1.5 text-xs text-[#ff0055] font-cyber">
              </div>
            </div>
          </div>

          <!-- 시스템 로그 (말풍선 대신 터미널 로그 형태) -->
          <div class="space-y-2 border-t border-zinc-800 pt-3">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold text-zinc-300 font-cyber">> CONSOLE_LOGS</span>
              <button id="btnAddBubble" class="px-2 py-1 bg-[#ff0055]/20 text-[#ff0055] hover:bg-[#ff0055]/40 text-[9px] font-bold font-cyber border border-[#ff0055]/50 transition">
                + ADD_LOG
              </button>
            </div>
            <div id="bubblesContainer" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
          </div>
        </div>

        <!-- [탭 3] 네온 테마 컬러 -->
        <div id="tab3" class="tab-content hidden space-y-4">
          <div>
            <label class="block text-[10px] text-zinc-400 mb-2 font-cyber">> SYSTEM_NEON_COLOR</label>
            <div class="flex items-center gap-2 flex-wrap">
              <button class="color-btn w-8 h-8 rounded-none bg-[#ff0055] border-2 border-white transition" data-color="#ff0055" title="도파 핑크"></button>
              <button class="color-btn w-8 h-8 rounded-none bg-[#00ffcc] border-2 border-transparent transition" data-color="#00ffcc" title="사이버 시안"></button>
              <button class="color-btn w-8 h-8 rounded-none bg-[#cc00ff] border-2 border-transparent transition" data-color="#cc00ff" title="글리치 퍼플"></button>
              <button class="color-btn w-8 h-8 rounded-none bg-[#ffff00] border-2 border-transparent transition" data-color="#ffff00" title="워닝 옐로우"></button>
              <button class="color-btn w-8 h-8 rounded-none bg-[#00ff00] border-2 border-transparent transition" data-color="#00ff00" title="터미널 그린"></button>
              
              <div class="flex items-center gap-1.5 ml-2 pl-2 border-l border-zinc-800">
                <input type="color" id="nativeColorPicker" value="#ff0055" class="w-8 h-8 cursor-pointer bg-transparent border-0 p-0">
              </div>
            </div>
            <p class="text-[9px] text-zinc-600 font-cyber mt-2">※ UI 보더, 글리치, 텍스트 하이라이트에 적용됩니다.</p>
          </div>
        </div>

      </div>
    </div>

    <!-- 푸터 -->
    <footer class="text-center pt-2 pb-6">
      <a href="https://your-dopa-url.com" target="_blank" class="inline-flex items-center gap-1.5 text-[10px] text-zinc-600 hover:text-[#ff0055] font-cyber transition">
        <span>> dopa.sys_override</span>
      </a>
    </footer>

  </main>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');

    let bgMedia = null;
    let animProgress = 0;
    let previewTimer = null;
    let isExporting = false;
    let themeColor = '#ff0055'; // 사이버 도파 핑크

    // SVG 네온 악마 로고 (DOPA 오리지널 형태)
    const dopaDevilSvg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="26,34 14,8 38,24" fill="%23ff0055"/><polygon points="74,34 86,8 62,24" fill="%23ff0055"/><circle cx="52" cy="56" r="38" fill="%23cc00ff"/><circle cx="49" cy="53" r="37" fill="%23ff0055"/><line x1="33" y1="46" x2="44" y2="57" stroke="%23111827" stroke-width="4.5" stroke-linecap="round"/><line x1="44" y1="46" x2="33" y2="57" stroke="%23111827" stroke-width="4.5" stroke-linecap="round"/><path d="M 56 50 Q 64 42 72 51" fill="none" stroke="%23111827" stroke-width="4.5" stroke-linecap="round"/><path d="M 37 66 Q 52 80 67 65" fill="none" stroke="%23111827" stroke-width="4.5" stroke-linecap="round"/><polygon points="61,70 65,77 67,70" fill="%23111827"/><polygon points="85,18 87,14 91,16 88,19 90,23 86,21 83,24 84,20 80,18 84,17" fill="%23ffffff"/></svg>`;
    const dopaLogoImg = new Image();
    dopaLogoImg.src = dopaDevilSvg;

    // 사각형 그리기 (사이버펑크 테마는 모서리가 각짐)
    function drawRect(c, x, y, w, h) {
      c.beginPath();
      c.rect(x, y, w, h);
      c.closePath();
    }
    const drawBgBox = drawRect;

    function getWrappedLines(context, text, maxWidth) {
      if (!text) return [''];
      const chars = Array.from(text);
      const lines = [];
      let currentLine = '';
      for (let i = 0; i < chars.length; i++) {
        const testLine = currentLine + chars[i];
        if (context.measureText(testLine).width > maxWidth && currentLine.length > 0) {
          lines.push(currentLine);
          currentLine = chars[i];
        } else {
          currentLine = testLine;
        }
      }
      if (currentLine) lines.push(currentLine);
      return lines.length > 0 ? lines : [''];
    }

    // 오브젝트 초기 위치 (비대칭적, 팝업창 느낌)
    const defaultElements = {
      targetProfile: { id: 'targetProfile', x: 50,  y: 60,  w: 260, h: 100 },
      logConsole:    { id: 'logConsole',    x: 40,  y: 180, w: 340, h: 300 },
      warningBox:    { id: 'warningBox',    x: 620, y: 440, w: 300, h: 60 },
      barcodeLabel:  { id: 'barcodeLabel',  x: 740, y: 50,  w: 180, h: 80 }
    };
    let elements = JSON.parse(JSON.stringify(defaultElements));
    let renderOrder = ['barcodeLabel', 'warningBox', 'targetProfile', 'logConsole'];
    let draggingItem = null;
    let dragOffset = { x: 0, y: 0 };

    // 로그 목록 (채팅 대신 터미널 로그 형태)
    let logEntries = [
      { type: 'sys', text: '', placeholder: 'SYSTEM: 대상의 불안정 지수 상승 중.' },
      { type: 'usr', text: '', placeholder: 'USRC_01: 접근을 시도합니다.' },
      { type: 'err', text: '', placeholder: 'ERROR: 권한이 부족합니다.' }
    ];

    // DOM 참조
    const bgInputGallery = document.getElementById('bgInputGallery');
    const bgInputFiles = document.getElementById('bgInputFiles');
    const bgStatus = document.getElementById('bgStatus');
    const quoteText = document.getElementById('quoteText');
    const senderName = document.getElementById('senderName');
    const dangerLevel = document.getElementById('dangerLevel');
    const nativeColorPicker = document.getElementById('nativeColorPicker');
    const bubblesContainer = document.getElementById('bubblesContainer');
    const btnAddBubble = document.getElementById('btnAddBubble');
    const btnResetPositions = document.getElementById('btnResetPositions');

    btnResetPositions.addEventListener('click', () => {
      elements = JSON.parse(JSON.stringify(defaultElements));
      renderOrder = ['barcodeLabel', 'warningBox', 'targetProfile', 'logConsole'];
      draw();
    });

    function renderLogInputs() {
      bubblesContainer.innerHTML = '';
      logEntries.forEach((log, idx) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-1 bg-[#050505] p-1.5 border border-zinc-800 text-xs';
        
        let btnClass = 'text-zinc-500';
        let btnText = 'SYS';
        if(log.type === 'usr') { btnClass = 'text-emerald-400'; btnText = 'USR'; }
        if(log.type === 'err') { btnClass = 'text-[#ff0055] font-bold'; btnText = 'ERR'; }

        row.innerHTML = `
          <button class="toggle-log-type px-1.5 py-1 text-[9px] font-cyber ${btnClass}" data-index="${idx}">[${btnText}]</button>
          <input type="text" value="${log.text}" placeholder="${log.placeholder}" class="log-text flex-1 bg-transparent border-0 text-white placeholder-zinc-700 text-[10px] px-1 font-cyber focus:outline-none" data-index="${idx}">
          <button class="delete-log text-zinc-600 hover:text-red-500 px-1 text-[10px]" data-index="${idx}">X</button>
        `;
        bubblesContainer.appendChild(row);
      });

      // 콘솔창 높이 동적 확장
      elements.logConsole.h = Math.max(220, 60 + logEntries.length * 50);

      document.querySelectorAll('.toggle-log-type').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const i = e.target.dataset.index;
          const types = ['sys', 'usr', 'err'];
          let curIdx = types.indexOf(logEntries[i].type);
          logEntries[i].type = types[(curIdx + 1) % 3];
          renderLogInputs();
          draw();
        });
      });

      document.querySelectorAll('.log-text').forEach(input => {
        input.addEventListener('input', (e) => {
          logEntries[e.target.dataset.index].text = e.target.value;
          draw();
        });
      });

      document.querySelectorAll('.delete-log').forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (logEntries.length <= 1) return;
          logEntries.splice(e.target.dataset.index, 1);
          renderLogInputs();
          draw();
        });
      });
    }

    btnAddBubble.addEventListener('click', () => {
      logEntries.push({ type: 'sys', text: '', placeholder: 'NEW_LOG_ENTRY' });
      renderLogInputs();
      draw();
    });
    renderLogInputs();

    // 탭 전환
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('border-[#ff0055]', 'text-[#ff0055]');
          b.classList.add('border-transparent', 'text-zinc-500');
        });
        btn.classList.add('border-[#ff0055]', 'text-[#ff0055]');
        btn.classList.remove('border-transparent', 'text-zinc-500');

        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(btn.dataset.tab).classList.remove('hidden');
      });
    });

    // 테마 컬러
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('border-white', 'border-transparent'));
        document.querySelectorAll('.color-btn').forEach(b => b.classList.add('border-transparent'));
        btn.classList.add('border-white');
        btn.classList.remove('border-transparent');
        themeColor = btn.dataset.color;
        nativeColorPicker.value = themeColor;
        draw();
      });
    });

    nativeColorPicker.addEventListener('input', (e) => {
      themeColor = e.target.value;
      draw();
    });

    [quoteText, senderName, dangerLevel].forEach(el => {
      el.addEventListener('input', () => draw());
    });

    // GIF 파서
    async function loadMediaFile(file, statusEl) {
      if (!file) return null;
      if (statusEl) {
        statusEl.textContent = 'ANALYZING...';
        statusEl.className = 'text-[9px] text-[#ff0055] font-cyber border border-[#ff0055]/50 px-1 py-0.5 animate-pulse';
      }

      try {
        const buffer = await file.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const isGifHeader = (bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46);

        if (isGifHeader) {
          const ReaderClass = (window.omggif && window.omggif.GifReader) || window.GifReader;
          if (ReaderClass) {
            const reader = new ReaderClass(bytes);
            const numFrames = reader.numFrames();
            if (numFrames > 1) {
              const w = reader.width, h = reader.height;
              const canvasList = [];
              const framePixels = new Uint8ClampedArray(w * h * 4);

              for (let i = 0; i < numFrames; i++) {
                reader.decodeAndBlitFrameRGBA(i, framePixels);
                const fCanvas = document.createElement('canvas');
                fCanvas.width = w; fCanvas.height = h;
                const fCtx = fCanvas.getContext('2d');
                const imgData = fCtx.createImageData(w, h);
                imgData.data.set(framePixels);
                fCtx.putImageData(imgData, 0, 0);
                canvasList.push(fCanvas);
              }

              if (statusEl) {
                statusEl.textContent = `GIF_OK [${canvasList.length}F]`;
                statusEl.className = 'text-[9px] text-emerald-400 font-cyber border border-emerald-500/50 px-1 py-0.5';
              }
              return { isGif: true, frames: canvasList, width: w, height: h };
            }
          }
        }
      } catch (err) { console.warn(err); }

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            if (statusEl) {
              statusEl.textContent = 'IMG_OK';
              statusEl.className = 'text-[9px] text-zinc-300 font-cyber border border-zinc-600 px-1 py-0.5';
            }
            resolve({ isGif: false, img, width: img.width, height: img.height });
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function onMediaSelected(inputEl) {
      if (inputEl.files && inputEl.files[0]) {
        bgMedia = await loadMediaFile(inputEl.files[0], bgStatus);
        draw();
      }
    }
    bgInputGallery.addEventListener('change', () => onMediaSelected(bgInputGallery));
    bgInputFiles.addEventListener('change', () => onMediaSelected(bgInputFiles));

    function getDrawableSource(media, prog) {
      if (!media) return null;
      if (media.isGif && media.frames && media.frames.length > 0) {
        const frameIdx = Math.floor(prog * media.frames.length * 3) % media.frames.length;
        return media.frames[frameIdx];
      }
      return media.img;
    }

    // 드래그 시스템
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function handleDragStart(e) {
      if (isExporting) return;
      const pos = getCanvasCoords(e);
      for (let i = renderOrder.length - 1; i >= 0; i--) {
        const key = renderOrder[i];
        const item = elements[key];
        if (pos.x >= item.x && pos.x <= item.x + item.w &&
            pos.y >= item.y && pos.y <= item.y + item.h) {
          draggingItem = key;
          dragOffset.x = pos.x - item.x;
          dragOffset.y = pos.y - item.y;
          renderOrder.splice(i, 1);
          renderOrder.push(key);
          if (e.cancelable) e.preventDefault();
          draw();
          break;
        }
      }
    }

    function handleDragMove(e) {
      if (!draggingItem || isExporting) return;
      const pos = getCanvasCoords(e);
      elements[draggingItem].x = Math.round(pos.x - dragOffset.x);
      elements[draggingItem].y = Math.round(pos.y - dragOffset.y);
      if (e.cancelable) e.preventDefault();
      draw();
    }

    function handleDragEnd() { draggingItem = null; draw(); }

    canvas.addEventListener('mousedown', handleDragStart);
    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);
    canvas.addEventListener('touchstart', handleDragStart, { passive: false });
    window.addEventListener('touchmove', handleDragMove, { passive: false });
    window.addEventListener('touchend', handleDragEnd);

    // ================= 메인 사이버 렌더링 엔진 =================
    function draw(prog = animProgress) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 글리치 그리드 베이스 배경
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 2. 미디어 렌더링 (사이버틱한 블렌딩)
      const bgSource = getDrawableSource(bgMedia, prog);
      if (bgSource && bgMedia) {
        ctx.save();
        // 이미지 전체를 화면에 맞게 넣되 양옆을 자름 (Cover)
        const scale = Math.max(canvas.width / bgMedia.width, canvas.height / bgMedia.height);
        const w = bgMedia.width * scale;
        const h = bgMedia.height * scale;
        // 약간 어둡게 합성하여 UI를 돋보이게 함
        ctx.globalAlpha = 0.85;
        ctx.drawImage(bgSource, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        ctx.restore();
      } else {
        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 24px "Share Tech Mono"';
        ctx.textAlign = 'center';
        ctx.fillText('NO_SIGNAL', canvas.width / 2, canvas.height / 2);
      }

      // 노이즈 오버레이
      const isGlitchTick = Math.random() > 0.92;
      if (isGlitchTick) {
        ctx.fillStyle = `rgba(${parseInt(themeColor.slice(1,3),16)}, ${parseInt(themeColor.slice(3,5),16)}, ${parseInt(themeColor.slice(5,7),16)}, 0.08)`;
        ctx.fillRect(0, Math.random() * canvas.height, canvas.width, Math.random() * 50 + 10);
      }

      // 3. UI 컴포넌트 렌더링
      renderOrder.forEach(key => {
        if (key === 'barcodeLabel') renderBarcodeLabel(prog);
        if (key === 'targetProfile') renderTargetProfile(prog);
        if (key === 'warningBox') renderWarningBox(prog);
        if (key === 'logConsole') renderLogConsole(prog);
      });

      // 테두리 뷰파인더 가이드선
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.6;
      ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
      ctx.globalAlpha = 1.0;

      // 십자 조준점
      ctx.beginPath();
      ctx.moveTo(canvas.width/2 - 20, canvas.height/2); ctx.lineTo(canvas.width/2 + 20, canvas.height/2);
      ctx.moveTo(canvas.width/2, canvas.height/2 - 20); ctx.lineTo(canvas.width/2, canvas.height/2 + 20);
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 드래그 가이드
      if (draggingItem && !isExporting) {
        const it = elements[draggingItem];
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(it.x - 2, it.y - 2, it.w + 4, it.h + 4);
        ctx.restore();
      }
    }

    // [컴포넌트 1] 바코드 라벨 (DPA-0100)
    function renderBarcodeLabel(prog) {
      const it = elements.barcodeLabel;
      ctx.save();
      
      // 하얀 바탕 테이프 느낌
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.strokeRect(it.x + 4, it.y + 4, it.w - 8, it.h - 8);

      // 바코드 라인 
      ctx.fillStyle = '#0f172a';
      const bars = [3, 1, 4, 2, 5, 2, 1, 4, 3, 2, 6, 2, 3, 1, 4, 2, 3];
      let curX = it.x + 16;
      bars.forEach((w, idx) => {
        if (idx % 2 === 0) ctx.fillRect(curX, it.y + 16, w, 32);
        curX += w + 2.5;
      });

      // 바코드 스캔 레이저 (위아래 왕복)
      const scanY = it.y + 16 + (Math.sin(prog * Math.PI * 2) * 0.5 + 0.5) * 32;
      ctx.fillStyle = themeColor;
      ctx.shadowColor = themeColor;
      ctx.shadowBlur = 10;
      ctx.fillRect(it.x + 12, scanY, it.w - 24, 2);
      ctx.shadowBlur = 0;

      ctx.font = 'bold 13px "Share Tech Mono"';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#0f172a';
      ctx.fillText('DPA-0100 // CONFIDENTIAL', it.x + it.w / 2, it.y + 66);

      ctx.restore();
    }

    // [컴포넌트 2] 타겟 프로필 (스탯 & 호감도/위험도)
    function renderTargetProfile(prog) {
      const it = elements.targetProfile;
      const name = senderName.value.trim() || senderName.placeholder.replace('예: ', '');
      const danger = parseInt(dangerLevel.value) || 85;

      ctx.save();
      ctx.fillStyle = 'rgba(5, 5, 10, 0.85)';
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 1.5;
      ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.strokeRect(it.x, it.y, it.w, it.h);

      // 헤더 라인
      ctx.fillStyle = themeColor;
      ctx.fillRect(it.x, it.y, it.w, 18);
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 11px "Share Tech Mono"';
      ctx.textAlign = 'left';
      ctx.fillText('TARGET_PROFILE_INFO', it.x + 8, it.y + 13);

      // 이름
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Pretendard';
      ctx.fillText(name, it.x + 16, it.y + 48);

      // 데인저 게이지 배경
      const barX = it.x + 16;
      const barY = it.y + 70;
      const barW = it.w - 32;
      const barH = 10;
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.fillRect(barX, barY, barW, barH);
      
      // 데인저 게이지 (에러 진동 효과)
      let shake = 0;
      if (danger > 80) shake = (Math.random() - 0.5) * 4;
      
      const curDangerW = barW * (danger / 100);
      ctx.fillStyle = themeColor;
      ctx.shadowColor = themeColor;
      ctx.shadowBlur = danger > 80 ? 15 : 0;
      ctx.fillRect(barX, barY, curDangerW + shake, barH);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#94a3b8';
      ctx.font = '10px "Share Tech Mono"';
      ctx.fillText(`DANGER_LVL : ${danger}%`, it.x + 16, it.y + 64);

      ctx.restore();
    }

    // [컴포넌트 3] 워닝 에러 캡슐 (도파 로고 삽입)
    function renderWarningBox(prog) {
      const it = elements.warningBox;
      const text = quoteText.value.trim() || quoteText.placeholder.replace('예: ', '');
      if (!text) return;

      ctx.save();
      
      // 빨간 점멸 에러 상자
      const isBlink = Math.sin(prog * Math.PI * 8) > 0;
      ctx.fillStyle = isBlink ? 'rgba(255, 0, 85, 0.9)' : 'rgba(10, 0, 0, 0.9)';
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 2;
      ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.strokeRect(it.x, it.y, it.w, it.h);

      // 도파 악마 로고 렌더링 (SVG 내장)
      if (dopaLogoImg.complete) {
        ctx.drawImage(dopaLogoImg, it.x + 12, it.y + 10, 40, 40);
      }

      ctx.fillStyle = isBlink ? '#ffffff' : '#ff0055';
      ctx.font = 'bold 14px "Share Tech Mono"';
      ctx.textAlign = 'left';
      ctx.fillText('SYSTEM_WARNING', it.x + 64, it.y + 24);

      ctx.fillStyle = '#ffffff';
      ctx.font = '500 13px Pretendard';
      ctx.fillText(text.length > 18 ? text.slice(0, 18) + '...' : text, it.x + 64, it.y + 44);

      ctx.restore();
    }

    // [컴포넌트 4] 시스템 로그 콘솔창 (말풍선 대체)
    function renderLogConsole(prog) {
      const it = elements.logConsole;
      ctx.save();

      ctx.fillStyle = 'rgba(0, 0, 5, 0.85)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.strokeRect(it.x, it.y, it.w, it.h);

      // 해커 콘솔 헤더
      ctx.fillStyle = '#111111';
      ctx.fillRect(it.x, it.y, it.w, 24);
      ctx.fillStyle = themeColor;
      ctx.font = 'bold 12px "Share Tech Mono"';
      ctx.textAlign = 'left';
      ctx.fillText('root@dopa-sys:~# tail -f /var/log/mind.log', it.x + 10, it.y + 16);

      // 로그 순차 출력 로직 (타자 치는 효과)
      const total = logEntries.length;
      const stepDur = 0.7 / total;
      
      let currentY = it.y + 40;

      logEntries.forEach((log, idx) => {
        const text = log.text.trim() || log.placeholder;
        const entryProgStart = idx * stepDur;
        
        if (prog >= entryProgStart) {
          // 타입별 색상
          let typeColor = '#94a3b8'; // sys
          if (log.type === 'usr') typeColor = '#34d399';
          if (log.type === 'err') typeColor = '#ff0055';

          ctx.font = 'bold 11px "Share Tech Mono"';
          ctx.fillStyle = typeColor;
          ctx.fillText(`[${log.type.toUpperCase()}]`, it.x + 12, currentY);

          // 타이핑 효과
          const localProg = Math.min(1, (prog - entryProgStart) / (stepDur * 0.8));
          const charCount = Math.ceil(localProg * text.length);
          const showText = text.substring(0, charCount);

          ctx.font = '12px Pretendard';
          ctx.fillStyle = '#e2e8f0';

          const lines = getWrappedLines(ctx, showText, it.w - 60);
          lines.forEach((line, lIdx) => {
            ctx.fillText(line, it.x + 48, currentY + lIdx * 18);
            // 커서 깜빡임
            if (lIdx === lines.length - 1 && localProg < 1) {
              const lw = ctx.measureText(line).width;
              ctx.fillStyle = themeColor;
              ctx.fillRect(it.x + 48 + lw + 2, currentY - 10 + lIdx * 18, 6, 12);
            }
          });
          currentY += 18 * lines.length + 12;
        }
      });

      // 하단 블록 커서
      if (prog >= 0.7 && Math.floor(prog * 20) % 2 === 0) {
        ctx.fillStyle = themeColor;
        ctx.fillRect(it.x + 12, currentY, 8, 14);
      }

      ctx.restore();
    }

    // 7초 루프 엔진
    draw(0);
    function startPreviewLoop() {
      stopPreviewLoop();
      previewTimer = setInterval(() => {
        if (isExporting) return;
        animProgress = (animProgress + 0.007) % 1;
        draw(animProgress);
      }, 50);
    }
    function stopPreviewLoop() {
      if (previewTimer) { clearInterval(previewTimer); previewTimer = null; }
    }
    startPreviewLoop();

    // ================= 고화질 내보내기 엔진 =================
    const btnGenerateGIF = document.getElementById('btnGenerateGIF');
    const btnGenerateMP4 = document.getElementById('btnGenerateMP4');
    const loadingStatus = document.getElementById('loadingStatus');
    const progressBar = document.getElementById('progressBar');
    const statusMsg = document.getElementById('statusMsg');
    const resultArea = document.getElementById('resultArea');
    const previewMediaWrapper = document.getElementById('previewMediaWrapper');
    const btnDownload = document.getElementById('btnDownload');
    const btnShareX = document.getElementById('btnShareX');

    btnGenerateGIF.addEventListener('click', () => {
      isExporting = true;
      stopPreviewLoop();
      btnGenerateGIF.disabled = true; btnGenerateMP4.disabled = true;
      loadingStatus.classList.remove('hidden'); resultArea.classList.add('hidden');
      progressBar.style.width = '15%'; statusMsg.textContent = '> CAPTURING_FRAMES...';

      const frames = [];
      for (let i = 0; i < 20; i++) {
        draw(i / 20);
        frames.push(canvas.toDataURL('image/png'));
      }

      progressBar.style.width = '45%'; statusMsg.textContent = '> ENCODING_GIF...';
      gifshot.createGIF({
        images: frames, gifWidth: 960, gifHeight: 540, interval: 0.25, sampleInterval: 2, numWorkers: 2
      }, function(obj) {
        isExporting = false; startPreviewLoop();
        btnGenerateGIF.disabled = false; btnGenerateMP4.disabled = false;
        loadingStatus.classList.add('hidden');
        if (!obj.error) {
          previewMediaWrapper.innerHTML = `<img src="${obj.image}" class="w-full h-full object-cover">`;
          btnDownload.href = obj.image; btnDownload.download = `dopa_sys_override.gif`;
          resultArea.classList.remove('hidden'); resultArea.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    btnGenerateMP4.addEventListener('click', () => {
      isExporting = true;
      stopPreviewLoop();
      btnGenerateGIF.disabled = true; btnGenerateMP4.disabled = true;
      loadingStatus.classList.remove('hidden'); resultArea.classList.add('hidden');
      progressBar.style.width = '10%'; statusMsg.textContent = '> RECORDING_VIDEO_STREAM...';

      draw(0.0);
      const stream = canvas.captureStream(30);
      let mimeType = 'video/mp4';
      if (!MediaRecorder.isTypeSupported('video/mp4')) {
        mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
      }
      
      let recorder;
      try { recorder = new MediaRecorder(stream, { mimeType }); } 
      catch (e) { recorder = new MediaRecorder(stream); }

      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || 'video/mp4' });
        const videoUrl = URL.createObjectURL(blob);
        previewMediaWrapper.innerHTML = `<video src="${videoUrl}" autoplay loop muted playsinline class="w-full h-full object-cover"></video>`;
        btnDownload.href = videoUrl; btnDownload.download = `dopa_sys_override.mp4`;
        
        isExporting = false; startPreviewLoop();
        btnGenerateGIF.disabled = false; btnGenerateMP4.disabled = false;
        loadingStatus.classList.add('hidden'); resultArea.classList.remove('hidden');
        resultArea.scrollIntoView({ behavior: 'smooth' });
      };

      recorder.start();
      let currentFrame = 0; const totalSteps = 180;
      const stepInterval = setInterval(() => {
        draw(currentFrame / totalSteps);
        currentFrame++;
        progressBar.style.width = `${Math.min(95, Math.round((currentFrame / totalSteps) * 100))}%`;
        statusMsg.textContent = `> COMPILING_VIDEO (${Math.round(currentFrame / 30)}/6s)...`;
        if (currentFrame >= totalSteps) { clearInterval(stepInterval); recorder.stop(); }
      }, 33);
    });

    btnShareX.addEventListener('click', () => {
      const url = window.location.href;
      const text = encodeURIComponent(`[SYSTEM OVERRIDE] 사이버펑크 페어틀 ⚠️\n#도파 #DOPA #페어틀 #사이버펑크 #자캐\n`);
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent(url)}`, '_blank');
    });
  </script>
</body>
